name: Publish to npm

# publica quando uma tag vX.Y.Z é enviada; a versão do package.json precisa ser igual à da tag
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  id-token: write # provenance e trusted publishing do npm

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: pnpm check
      - run: npm publish --access public --provenance
